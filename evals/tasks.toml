# Evaluation tasks for the local fixture server (evals/fixtures/server.py).
#
# Each task starts from a fresh server state (POST /__reset) and a fresh browser profile at
# <base><start_path>. The check with the same id in evals/checks.py scores the run from GET /__state and the
# agent's report.json.
#
# Fields:
#   id           unique name; evals/checks.py has check_<id>
#   app          the fixture app the task starts in
#   start_path   path to open first (relative to the server base URL)
#   instruction  what the user asks, in plain words; secrets are named, never written out
#   mode         "task" (do something) or "test" (explore the app and report bugs as findings)
#   needs_human  human steps the run is expected to ask for (approve_payment, approve_signature, approve_post)
#   max_steps    step budget for the agent
#   difficulty   easy | medium | hard
#   skills       what the task exercises: forms, navigation, popup, drag, vision, keyboard, long-horizon,
#                injection, secrets, approval, tabs, upload, dialog, reading

[[task]]
id = "shop_signup_purchase"
app = "shop"
start_path = "/shop/"
mode = "task"
instruction = """
Create a new account in the Leaf & Co shop. Use the full name from secret SHOP_NAME, the e-mail from secret SHOP_EMAIL
and the password from secret SHOP_PASSWORD, and accept the terms and conditions. The shop sends a confirmation e-mail
to that address: open the webmail at /mail/ and click the confirmation link. Then add this delivery address to the
account: Bloemstraat 12, 1015 AB Amsterdam, Netherlands. Put exactly these products in the cart and nothing else:
1 x Calathea Orbifolia with the Large (24 cm) pot, and 2 x Liquid Plant Food. Pay by card with the card from secrets
CARD_NUMBER, CARD_EXP, CARD_CVC and CARD_NAME. Tell me the order number.
"""
needs_human = ["approve_payment"]
max_steps = 90
difficulty = "hard"
skills = ["forms", "navigation", "tabs", "long-horizon", "secrets", "approval", "keyboard"]

